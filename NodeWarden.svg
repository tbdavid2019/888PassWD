<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="64" y1="36" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Edge Luminous Highlight -->
    <linearGradient id="edgeGlow" x1="256" y1="48" x2="256" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#60A5FA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Ring Gradient 1 (Top Left) -->
    <linearGradient id="ringGrad1" x1="160" y1="140" x2="260" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Ring Gradient 2 (Top Right) -->
    <linearGradient id="ringGrad2" x1="350" y1="140" x2="250" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Ring Gradient 3 (Bottom) -->
    <linearGradient id="ringGrad3" x1="256" y1="240" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="shieldShadow" x="24" y="24" width="464" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E40AF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Cyber Shield -->
  <path d="M256 48C356 48 436 78 448 108C452 236 420 364 256 464C92 364 60 236 64 108C76 78 156 48 256 48Z"
        fill="url(#shieldGrad)"
        filter="url(#shieldShadow)" />

  <!-- Inner Bevel Rim -->
  <path d="M256 64C346 64 420 90 430 118C434 230 404 346 256 438C108 346 78 230 82 118C92 90 166 64 256 64Z"
        stroke="url(#edgeGlow)"
        stroke-width="5"
        stroke-linecap="round"
        fill="none" />

  <!-- The 888 Cryptographic Bastion (Triple interlocking rounded loops) -->
  <g id="brand-888">
    <!-- Top-Left Loop (Loop 1) -->
    <circle cx="210" cy="205" r="58" stroke="url(#ringGrad1)" stroke-width="20" fill="none" opacity="0.95" />

    <!-- Top-Right Loop (Loop 2) -->
    <circle cx="302" cy="205" r="58" stroke="url(#ringGrad2)" stroke-width="20" fill="none" opacity="0.95" />

    <!-- Bottom Center Loop (Loop 3) -->
    <circle cx="256" cy="285" r="58" stroke="url(#ringGrad3)" stroke-width="20" fill="none" opacity="0.95" />

    <!-- Overlap Interlock Details for True Chain Depth -->
    <path d="M210 147A58 58 0 0 1 256 168A58 58 0 0 1 302 147" stroke="url(#ringGrad1)" stroke-width="20" stroke-linecap="round" fill="none" />
    <path d="M256 227A58 58 0 0 1 280 232A58 58 0 0 0 302 263" stroke="url(#ringGrad2)" stroke-width="20" stroke-linecap="round" fill="none" />
    <path d="M202 263A58 58 0 0 0 256 343A58 58 0 0 0 310 263" stroke="url(#ringGrad3)" stroke-width="20" stroke-linecap="round" fill="none" />

    <!-- Central Fortress Core Spark -->
    <circle cx="256" cy="232" r="14" fill="#FFFFFF" />
    <path d="M256 218L263 232L256 246L249 232Z" fill="#0284C7" />
  </g>
</svg>