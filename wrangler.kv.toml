name = "nodewarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "379570860738dd1757ba7f67ef2bdffe"

[vars]
RESEND_FROM = "888 PassWD <no-reply@vip.david888.com>"
CLEF_PRIMARY_URL = "https://clef.create360.ai/v1/systemone"
CLEF_FALLBACK_URL = "https://clef.aiurl.tw/v1/systemone"
TYPESAFE_API_URL = "https://api.typesafe.ai/v1/systemone"
TYPESAFE_API_KEY = "***REMOVED***"

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

# Cloudflare Workers Free plan allows up to 5 cron triggers per account.
# Uncomment if your account has available cron trigger quota for automated backups:
# [triggers]
# crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"
database_id = "decf8d91-238c-45c6-bf32-ce5500b4921a"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[kv_namespaces]]
binding = "ATTACHMENTS_KV"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
